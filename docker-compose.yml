version: '3.8'

services:
  # API 服务
  api:
    build: .
    ports:
      - "${POLYBOB_API_PORT:-18000}:18000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://polybob:polybob@postgres:5432/polybob
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - POLYBOB_API_PORT=18000
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      # Keep the image's Linux virtualenv instead of shadowing it with the host one.
      - /app/.venv
    command: python -m apps.api.main

  # PostgreSQL
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_USER=polybob
      - POSTGRES_PASSWORD=polybob
      - POSTGRES_DB=polybob
    ports:
      - "${POLYBOB_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "${POLYBOB_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data

  # Prometheus (可选)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${POLYBOB_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana (可选)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "${POLYBOB_GRAFANA_PORT:-13000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
