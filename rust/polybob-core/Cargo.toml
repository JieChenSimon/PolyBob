[package]
name = "polybob-core"
version = "0.1.0"
edition = "2021"
description = "CPU-intensive quantitative kernels for PolyBob"
license = "MIT"

[lib]
name = "polybob_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.23"
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
