[project]
name = "polybob"
version = "0.1.0"
description = "Polymarket 实时分析与交易自动化系统"
authors = [
    {name = "Simon Chen", email = "simon@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.46.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "anthropic>=0.18.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "numba>=0.59.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    # The bitemporal store (libs/data/store.py). Parquet for append-only
    # observation history and DuckDB for the as-of window query that makes
    # look-ahead structurally unavailable. DuckDB dynamically imports pytz
    # when returning timezone-aware Python values.
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "pytz>=2024.1",
    "torch>=2.0.0",
    "akshare>=1.18.0",
]

[project.optional-dependencies]
native = [
    "polybob-core",
]
forecasting = [
    # Kronos is an opt-in lab capability. Keep its model-loading stack out of
    # the default API/test environment so forecasting can never widen the core
    # startup surface accidentally.
    "einops>=0.8.0",
    "huggingface-hub>=0.34.0",
    "safetensors>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
required-version = ">=0.11.0,<0.12.0"

[tool.uv.sources]
polybob-core = { path = "rust/polybob-core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "apps",
    "libs",
    "modules",
    "strategies",
    "config",
    "data",
]
exclude = [
    "apps/dashboard/**",
]
