# Pytest配置
[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    unit: Unit tests
    integration: Integration tests
    backtest: Backtest validation tests
    performance: Performance benchmark tests
    stress: Stress and load tests
    slow: Slow running tests

# 覆盖率配置
addopts =
    --strict-markers
    --tb=short
    --disable-warnings

# 覆盖率报告
[coverage:run]
source =
    libs
    strategies
    services
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

# 覆盖率目标
fail_under = 80

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
