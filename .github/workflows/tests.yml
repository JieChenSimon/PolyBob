name: PolyBob Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "0.11.32"

    - name: Install dependencies
      run: uv sync --locked

    - name: Verify wheel contents and isolated import
      run: |
        uv build --wheel
        uv venv --python ${{ matrix.python-version }} /tmp/polybob-wheel-venv
        uv pip install --python /tmp/polybob-wheel-venv/bin/python dist/polybob-*.whl
        (cd /tmp && /tmp/polybob-wheel-venv/bin/python -c "from apps.api.main import app; import modules")

    # The whole suite, not three subdirectories. Most tests live directly in
    # tests/, so the previous three steps silently skipped them — including the
    # check that the promotion board still matches the evidence it claims.
    # Live-provider tests are excluded by pytest.ini's `-m "not real_data"`.
    - name: Run test suite
      run: |
        uv run --locked pytest -v --cov=libs --cov=strategies --cov-report=xml

    - name: Validate development control state
      run: uv run --locked python scripts/dev_control.py validate

    - name: Run backtest validation
      run: |
        uv run --locked pytest tests/backtest/ -v -m backtest

    # The gate that decides what may reach the execution desk must be a pure
    # function of the committed experiment output. If someone re-ran an
    # experiment without regenerating the board, or edited a row by hand, this
    # fails here rather than being discovered by trading on it.
    - name: Promotion board matches the evidence
      run: |
        # research.py check also reports evidence that cannot be replayed —
        # a trade row citing an unreproducible run is a claim, not evidence.
        uv run --locked python scripts/research.py check

    - name: Nothing may reintroduce an overwritable cache
      run: |
        # data/market_cache/ was 613 committed JSON files with no observation
        # time, which is why the insider study returned n=753 one day and n=667
        # the next. It is now a rebuildable cache, and the *store* is the
        # evidence substrate. Re-tracking either would restore the defect.
        if git ls-files --error-unmatch data/market_cache >/dev/null 2>&1; then
          echo "data/market_cache is tracked again — see .gitignore"; exit 1
        fi
        if git ls-files data/store | grep -q .; then
          echo "data/store is tracked — it is derived, rebuild with warm_cache.py"; exit 1
        fi
        # The evidence itself must stay tracked.
        for f in data/promotion_board.json data/hypothesis_registry.json; do
          git ls-files --error-unmatch "$f" >/dev/null || { echo "$f untracked"; exit 1; }
        done
        echo "data boundary intact"

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  # P11 — Next.js dashboard: type-check, unit tests, production build.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: apps/dashboard/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check source
      # Type-check application/source code. Test files (*.test.ts) are type-
      # exercised by the vitest step below; an ephemeral config keeps the
      # source gate strict without coupling to test-file looseness.
      run: |
        cat > tsconfig.ci.json <<'EOF'
        {
          "extends": "./tsconfig.json",
          "exclude": ["node_modules", "**/*.test.ts", "**/*.test.tsx"]
        }
        EOF
        npx tsc --noEmit -p tsconfig.ci.json
        rm -f tsconfig.ci.json

    - name: Run dashboard tests
      run: npm test

    - name: Build Next.js dashboard
      run: npm run build

  # P11 — restart-recovery: assert execution/persistence state survives a restart
  # (via the persistence tests) plus an API boot smoke across a restart.
  restart-recovery:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v4

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "0.11.32"

    - name: Install dependencies
      run: uv sync --locked

    - name: Restart-recovery / persistence tests
      run: |
        uv run --locked pytest tests/test_persistence_recovery.py tests/test_ops_events.py tests/test_ops_metrics.py -v

    - name: API restart smoke (start, restart, assert it recovers)
      run: |
        set -e
        start_api() {
          uv run --locked python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 18080 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/metrics >/dev/null; then
              echo "API up (pid $(cat /tmp/api.pid))"; return 0
            fi
            sleep 1
          done
          echo "API failed to start"; exit 1
        }
        stop_api() {
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          wait "$(cat /tmp/api.pid)" 2>/dev/null || true
        }

        # First boot: write state through the health/metrics surface.
        start_api
        curl -sf http://127.0.0.1:18080/ >/dev/null
        curl -sf http://127.0.0.1:18080/metrics | grep -q polybob_http_request_duration_seconds
        stop_api

        # Restart: the process must come back and serve metrics again.
        start_api
        curl -sf http://127.0.0.1:18080/metrics | grep -q polybob_http_request_duration_seconds
        stop_api
        echo "restart-recovery smoke passed"
