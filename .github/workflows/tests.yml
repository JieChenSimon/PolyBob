name: PolyBob Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=libs --cov=strategies --cov-report=xml

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v

    - name: Run backtest validation
      run: |
        pytest tests/backtest/ -v -m backtest

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  # P11 — Next.js dashboard: type-check, unit tests, production build.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: apps/dashboard/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check source
      # Type-check application/source code. Test files (*.test.ts) are type-
      # exercised by the vitest step below; an ephemeral config keeps the
      # source gate strict without coupling to test-file looseness.
      run: |
        cat > tsconfig.ci.json <<'EOF'
        {
          "extends": "./tsconfig.json",
          "exclude": ["node_modules", "**/*.test.ts", "**/*.test.tsx"]
        }
        EOF
        npx tsc --noEmit -p tsconfig.ci.json
        rm -f tsconfig.ci.json

    - name: Run dashboard tests
      run: npm test

    - name: Build Next.js dashboard
      run: npm run build

  # P11 — restart-recovery: assert execution/persistence state survives a restart
  # (via the persistence tests) plus an API boot smoke across a restart.
  restart-recovery:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Restart-recovery / persistence tests
      run: |
        pytest tests/test_persistence_recovery.py tests/test_ops_events.py tests/test_ops_metrics.py -v

    - name: API restart smoke (start, restart, assert it recovers)
      run: |
        set -e
        start_api() {
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 18080 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/metrics >/dev/null; then
              echo "API up (pid $(cat /tmp/api.pid))"; return 0
            fi
            sleep 1
          done
          echo "API failed to start"; exit 1
        }
        stop_api() {
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          wait "$(cat /tmp/api.pid)" 2>/dev/null || true
        }

        # First boot: write state through the health/metrics surface.
        start_api
        curl -sf http://127.0.0.1:18080/ >/dev/null
        curl -sf http://127.0.0.1:18080/metrics | grep -q polybob_http_request_duration_seconds
        stop_api

        # Restart: the process must come back and serve metrics again.
        start_api
        curl -sf http://127.0.0.1:18080/metrics | grep -q polybob_http_request_duration_seconds
        stop_api
        echo "restart-recovery smoke passed"
